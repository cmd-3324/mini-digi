{% load static %}
{% load i18n %}
<!-- Topbar Start -->


<!-- Navbar Start -->
<div class="container-fluid bg-dark mb-30">
    <div class="row px-xl-5">
        <div class="col-lg-3 d-none d-lg-block">
            <a class="btn d-flex align-items-center justify-content-between bg-primary w-100" data-toggle="collapse"
                href="#navbar-vertical" style="height: 65px; padding: 0 30px;">
                <h6 class="text-dark m-0"><i class="fa fa-bars mr-2"></i>{% trans "Categories" %}</h6>
                <i class="fa fa-angle-down text-dark"></i>
            </a>
            <nav class="collapse position-absolute navbar navbar-vertical navbar-light align-items-start p-0 bg-light"
                id="navbar-vertical" style="width: calc(100% - 30px); z-index: 999;">
                <div class="navbar-nav w-100">
                    {% for cat in categories %}
                    <a href="{% url 'shop:product_list' %}?category={{ cat.slug }}" class="nav-item nav-link">{{
                        cat.translated_name }}</a>
                    {% endfor %}
                </div>
            </nav>
        </div>
        <div class="col-lg-9">
            <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3 py-lg-0 px-0">
                <a href="{% url 'shop:index' %}" class="text-decoration-none d-block d-lg-none">
                    <span class="h1 text-uppercase text-dark bg-light px-2">Mini</span>
                    <span class="h1 text-uppercase text-light bg-primary px-2 ml-n1">Digi</span>
                </a>
                <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                    <div class="navbar-nav mr-auto py-0">
                        <a href="{% url 'shop:index' %}"
                            class="nav-item nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">{%
                            trans "Home" %}</a>
                        <a href="{% url 'shop:product_list' %}"
                            class="nav-item nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">{%
                            trans "Shop" %}</a>
                        <a href="{% url 'shop:contact' %}"
                            class="nav-item nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">{%
                            trans "Contact" %}</a>
                    </div>
                    <div class="navbar-nav ml-auto py-0 d-none d-lg-block">
                        <a href="{% url 'cart:detail' %}" class="btn px-0">
                            <i class="fas fa-shopping-cart text-primary"></i>
                            <span class="badge text-secondary border border-secondary rounded-circle"
                                style="padding-bottom: 2px;">
                                {{ cart_item_count|default:0 }}
                            </span>
                        </a>
                    </div>
                </div>
            </nav>
        </div>
    </div>
</div>
<!-- Navbar End -->
