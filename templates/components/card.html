{% load static %}
<div class="product-item bg-light mb-4">
    <div class="product-img position-relative overflow-hidden">
        {% if product.image %}
            <img class="img-fluid w-100" src="{{ product.image.url }}" alt="{{ product.name }}">
        {% else %}
            <img class="img-fluid w-100" src="{% static 'img/product-1.jpg' %}" alt="{{ product.name }}">
        {% endif %}
        <div class="product-action">
            <a class="btn btn-outline-dark btn-square" href="{% url 'shop:product_detail' product.pk %}"><i class="fa fa-search"></i></a>
            <form method="post" action="{% url 'cart:add' product.pk %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="1">
                <button type="submit" class="btn btn-outline-dark btn-square"><i class="fa fa-shopping-cart"></i></button>
            </form>
            <a class="btn btn-outline-dark btn-square" href="#"><i class="far fa-heart"></i></a>
            <a class="btn btn-outline-dark btn-square" href="#"><i class="fa fa-sync-alt"></i></a>
        </div>
    </div>
    <div class="text-center py-4">
        <a class="h6 text-decoration-none text-truncate" href="{% url 'shop:product_detail' product.pk %}">{{ product.name }}</a>
        <div class="d-flex align-items-center justify-content-center mt-2">
            <h5>{{ product.price|floatformat:0 }} T</h5>
        </div>
        <div class="d-flex align-items-center justify-content-center mb-1">
            <small class="fa fa-star text-primary mr-1"></small>
            <small class="fa fa-star text-primary mr-1"></small>
            <small class="fa fa-star text-primary mr-1"></small>
            <small class="fa fa-star text-primary mr-1"></small>
            <small class="fa fa-star text-primary mr-1"></small>
            <small>(99)</small>
        </div>
    </div>
</div>
