{% load static %}
<div class="col-lg-4 col-md-6 col-sm-6 pb-1">
    <div class="product-item bg-light mb-4">
        <div class="product-img position-relative overflow-hidden">
            {% if product.image %}
                <img class="img-fluid w-100" src="{{ product.image.url }}" alt="{{ product.name }}" style="height:220px; object-fit:cover;">
            {% else %}
                <img class="img-fluid w-100" src="https://placehold.co/300x220/f0f0f0/999?text={{ product.name|urlencode }}" alt="{{ product.name }}" style="height:220px; object-fit:cover;">
            {% endif %}
            <div class="product-action">
                <a class="btn btn-outline-dark btn-square" href="{% url 'shop:product_detail' product.id %}">
                    <i class="fa fa-search"></i>
                </a>
                <form method="post" action="{% url 'cart:add' product.id %}" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="quantity" value="1">
                    <button type="submit" class="btn btn-outline-dark btn-square">
                        <i class="fa fa-shopping-cart"></i>
                    </button>
                </form>
            </div>
        </div>
        <div class="text-center py-4">
            <a class="h6 text-decoration-none text-truncate" href="{% url 'shop:product_detail' product.id %}">{{ product.name }}</a>
            <div class="d-flex align-items-center justify-content-center mt-2">
                <h5>{{ product.price|floatformat:0 }} T</h5>
            </div>
            <div class="d-flex align-items-center justify-content-center mb-1">
                <small class="fa fa-star text-primary mr-1"></small>
                <small class="fa fa-star text-primary mr-1"></small>
                <small class="fa fa-star text-primary mr-1"></small>
                <small class="fa fa-star text-primary mr-1"></small>
                <small class="far fa-star text-primary mr-1"></small>
            </div>
        </div>
    </div>
</div>
