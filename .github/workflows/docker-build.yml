name: Build and Push Docker image

on:
  # Allows you to trigger the build manually and specify a version
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Image version tag (e.g., v1, v2, v3)'
        required: true
        default: 'v1'
  # Optional: keep this if you still want a standard build on every main push
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # This creates BOTH the specific version tag and the 'latest' tag
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mini-digi:${{ github.event.inputs.version_tag || 'latest' }}
            ${{ secrets.DOCKER_USERNAME }}/mini-digi:latest