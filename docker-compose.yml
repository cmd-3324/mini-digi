

services:
  db:
    image: mysql:8.0
    container_name: minidigi_db
    environment:
      MYSQL_DATABASE: mini_digi
      MYSQL_USER: minidigi_user
      MYSQL_PASSWORD: secure_password
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: minidigi_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: mini_digi
      DB_USER: minidigi_user
      DB_PASSWORD: secure_password
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - .:/app

volumes:
  mysql_data:
    name: mini-digi